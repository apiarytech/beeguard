name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Fail instead of silently downloading a newer toolchain, so each matrix
  # entry really tests the Go version it names.
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - '1.27.1' # Minimum version. Keep in sync with the go directive in go.mod.
          - 'stable'
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

    # The SQLite journal of the beeguard command is behind the sqlite build
    # tag (it adds modernc.org/sqlite and its modules), so build and test it
    # separately. sqljournal itself needs no tag.
    - name: Build with the SQLite journal
      run: go build -v -tags sqlite ./...

    - name: Vet with the SQLite journal
      run: go vet -tags sqlite ./...

    - name: Test the SQLite journal and command
      run: go test -v -count=1 -tags sqlite ./journal/... ./cmd/...

  # examples/guard/field is its own module and develops against sibling
  # checkouts of beeguard and honeycomb (replace ../../../../honeycomb), so
  # ./... from the root skips it and it cannot build from this repository
  # alone.

  lint-race:
    name: Format and race detector
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Test with race detector
      run: go test -race -count=1 -tags sqlite ./...

  raspberry-pi:
    name: Raspberry Pi (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pi Zero and Pi 1, 32-bit ARMv6
            goarch: arm
            goarm: '6'
            artifact: beeguard-linux-armv6
          - name: Pi 2 and Pi 3, 32-bit ARMv7
            goarch: arm
            goarm: '7'
            artifact: beeguard-linux-armv7
          - name: Pi 3, 4 and 5, 64-bit
            goarch: arm64
            goarm: ''
            artifact: beeguard-linux-arm64
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      # modernc.org/sqlite is pure Go: no C cross-compiler is needed.
      CGO_ENABLED: '0'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    # QEMU runs the ARM test binaries on the x86 runner.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm,arm64

    - name: Build
      run: go build -v -tags sqlite ./...

    - name: Vet
      run: go vet -tags sqlite ./...

    - name: Test
      run: go test -count=1 -tags sqlite ./...

    - name: Build the beeguard command
      run: go build -tags sqlite -o ${{ matrix.artifact }} ./cmd/beeguard

    - name: Upload the beeguard command
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact }}

  tinygo-test:
    name: TinyGo Build Test
    runs-on: ubuntu-latest
    env:
      # TinyGo selects its own Go toolchain.
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable' # TinyGo needs a Go installation

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: '0.42.0'

      # The alarm model, engine, evaluator, journal interface and API run
      # under TinyGo. tagbridge and link do not: they import honeycomb, whose
      # network server needs http.Server.ListenAndServeTLS, which TinyGo's
      # net/http lacks. config and journal/filejournal pass on Linux runners
      # once checked; add them here after the first green run.
      - name: Test with TinyGo
        run: tinygo test -v ./alarm ./engine ./evaluator ./journal ./api ./sink/slogsink
