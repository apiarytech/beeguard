name: CLA

# Checks that the author of every pull request has signed CLA.md. A
# first-time contributor signs by commenting on the pull request; the
# signature is recorded on the cla-signatures branch of this repository.
# "recheck" as a comment re-runs the check.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v1.json
          path-to-document: https://github.com/apiarytech/beeguard/blob/main/CLA.md
          branch: cla-signatures
          # Accounts that need not sign: bots, and the Project Owner's own
          # account (add it here).
          allowlist: dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: 'Thank you for the pull request. beeguard is dual-licensed, so contributors sign the [contributor licence agreement](https://github.com/apiarytech/beeguard/blob/main/CLA.md) once. Please read it and, if you agree, reply with the sentence below.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
