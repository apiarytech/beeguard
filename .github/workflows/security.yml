name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  govulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    # Reports only vulnerabilities in code the module actually calls,
    # including the SQLite journal behind the sqlite tag.
    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
        govulncheck -tags sqlite ./...

  gosec:
    name: Static security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    # Findings go to the Security tab instead of failing the build.
    - name: Run gosec
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -no-fail -tags sqlite -fmt sarif -out gosec.sarif ./...

    - name: Upload results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: gosec.sarif
        category: gosec

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Verify module downloads
      run: go mod verify

    # Prints the needed changes and fails if go.mod or go.sum is not tidy.
    - name: Check go mod tidy
      run: go mod tidy -diff
