name: Feature request
description: Suggest something beeguard should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Feature requests are public, and by posting one you agree to the terms of submission in [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md): the idea may be used freely in beeguard and in related products. Do not post anything confidential.
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: The real situation where this would help, and what you do today instead
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What beeguard should do, as concretely as you can
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: willing
    attributes:
      label: Would you implement it?
      options:
        - "No"
        - "Yes, with guidance"
        - "Yes, I have a design or a draft"
