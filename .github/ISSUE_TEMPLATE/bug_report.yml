name: Bug report
description: Something in beeguard does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before you continue:

        - **Security problem?** Do not post it here. Use the private channel in [SECURITY.md](../blob/main/SECURITY.md).
        - **This issue is public and permanent.** Do not paste credentials, keys, customer data, plant tag names or network addresses.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, in a sentence or two
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact error text or output, in a code block
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: beeguard version
      description: The tag or commit you are running
      placeholder: "v0.3.0, or the short commit hash"
    validations:
      required: true
  - type: input
    id: go_version
    attributes:
      label: Go version
      description: Output of `go version`
      placeholder: "go version go1.27.2 linux/arm64"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, and the hardware if it is not a PC
      placeholder: "Linux arm64 on Raspberry Pi 5 / Windows 11 amd64"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Anything else
      description: Configuration, logs (with secrets removed), related issues
